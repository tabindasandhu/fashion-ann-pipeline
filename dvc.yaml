stages:
  prepare:
    cmd: venv\Scripts\python.exe src/prepare.py
    deps:
      - src/prepare.py
    outs:
      - data/raw

  preprocess:
    cmd: venv\Scripts\python.exe src/preprocess.py
    deps:
      - src/preprocess.py
      - data/raw
    params:
      - preprocess.test_size
      - preprocess.seed
    outs:
      - data/processed

  train:
    cmd: venv\Scripts\python.exe src/train.py
    deps:
      - src/train.py
      - data/processed
    params:
      - preprocess.seed
      - train.dense_units
      - train.dropout_rate
      - train.learning_rate
      - train.epochs
      - train.batch_size
    outs:
      - models/model.h5
      - models/history.csv

  evaluate:
    cmd: venv\Scripts\python.exe src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.h5
      - data/processed
    outs:
      - models/confusion_matrix.png
    metrics:
      - metrics.json:
          cache: false
